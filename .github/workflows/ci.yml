name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Syntax check
        run: npm run check

  pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist --cache .npm-cache

      - name: Publish dry-run
        run: npm publish --dry-run --access public --cache .npm-cache

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: dsh-ai-wiki-tarball
          path: dist/*.tgz
          retention-days: 7
