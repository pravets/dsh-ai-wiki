name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Node 22/24 ships npm 10/11.9; trusted publishing needs npm >= 11.5.1
      # (and npm 11.15+ is the current supported line).
      - name: npm for trusted publishing
        run: npm install -g "npm@^11.15.0"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Syntax check
        run: npm run check

      - name: Compare tag with package version
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.RELEASE_TAG.replace(/^v/, ''); if (p.version !== tag) { console.error('tag ' + tag + ' does not match package version ' + p.version); process.exit(1); }"

      - name: Pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist --cache .npm-cache

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: dsh-ai-wiki-release
          path: dist/*.tgz
          retention-days: 30

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.tgz
          generate_release_notes: true

      # Trusted publishing uses the GitHub OIDC token, no NPM_TOKEN here.
      # The first 0.1.0 is bootstrapped once; this step skips an existing version.
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-ai-wiki@$version" version >/dev/null 2>&1; then
            echo "version $version is already published — skipping"
          else
            npm publish --access public --provenance
          fi
